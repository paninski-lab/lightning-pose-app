<app-alert-dialog (dismiss)="closeDialog()">
  <app-alert-header>
    <span class="text-error">
      Delete Model:
      <code class="text-base-content">{{ modelRelativePath() }}</code>
    </span>
  </app-alert-header>

  <div class="prose">
    <p>
      This will permanently delete the model's directory containing its
      configuration, weights, and prediction outputs.
    </p>
    <div class="flex flex-col gap-2">
      <label class="text-sm" for="delete-model-confirm">
        Type <code>{{ modelRelativePath() }}</code> to confirm permanent
        deletion
      </label>
      <input
        id="delete-model-confirm"
        type="text"
        class="input input-bordered w-full"
        [ngModel]="deleteConfirmation()"
        (ngModelChange)="deleteConfirmation.set($event)"
        [attr.aria-label]="'Type ' + modelRelativePath() + ' to confirm'"
      />
    </div>
  </div>

  <app-alert-footer>
    <button class="btn btn-soft btn-primary" (click)="closeDialog()">Cancel</button>
    <button
      class="btn btn-soft btn-error"
      (click)="handleDelete()"
      [disabled]="deleteConfirmation() !== modelRelativePath()"
    >
      Delete Permanently
    </button>
  </app-alert-footer>
</app-alert-dialog>
