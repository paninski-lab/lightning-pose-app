<app-alert-dialog (dismiss)="closeDialog()">
  <app-alert-header>
    <span class="text-error">
      Remove Project: <code class="text-base-content">{{ projectKey() }}</code>
    </span>
  </app-alert-header>
  <p class="prose">
    Removes the project from the registered list of projects, but will not
    delete any files, unless you also check the following
  </p>

  <div class="my-6">
    <div class="form-control">
      <label class="cursor-pointer flex justify-start gap-3">
        <input
          data-testid="delete-project-permanent"
          type="checkbox"
          class="checkbox"
          [ngModel]="removeFiles()"
          (ngModelChange)="removeFiles.set($event)"
        />
        <span>Permanently delete files</span>
      </label>
      <div class="ml-9 text-sm opacity-70">
        Data: <code>{{ dataDir() }}</code
        ><br />
        @if (modelDir()) {
          Models: <code>{{ modelDir() }}</code>
        }
      </div>
      @if (removeFiles()) {
        <label class="ml-9 mt-3 flex flex-col gap-2 text-sm">
          <span>
            Type <code>{{ projectKey() }}</code> to confirm permanent deletion
          </span>
          <input
            data-testid="delete-project-confirm-name"
            type="text"
            class="input input-bordered w-full"
            [ngModel]="confirmName()"
            (ngModelChange)="confirmName.set($event)"
            [attr.aria-label]="'Type ' + projectKey() + ' to confirm'"
          />
        </label>
      }
    </div>
  </div>

  <app-alert-footer>
    <button class="btn btn-soft btn-info" (click)="closeDialog()">Cancel</button>
    <button
      data-testid="delete-project-confirm"
      type="button"
      class="btn btn-soft btn-error"
      [disabled]="removeFiles() && confirmName() !== projectKey()"
      (click)="handleDelete()"
    >
      @if (removeFiles()) {
        Delete permanently
      } @else {
        Remove
      }
    </button>
  </app-alert-footer>
</app-alert-dialog>
