<div class="video-controls-container p-4">
  <div class="flex items-center gap-1">
    <button
      type="button"
      class="btn btn-ghost btn-sm tooltip tooltip-top"
      data-tip="Go to start"
      aria-label="Go to start"
      tabindex="-1"
      [disabled]="!hasVideo()"
      (mousedown)="$event.preventDefault()"
      (click)="videoPlayerState.seekToStart()"
    >
      <span class="material-icons">skip_previous</span>
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-sm tooltip tooltip-top step-tip"
      data-tip="Previous frame&#10;(Shift+click = 10 frames)"
      aria-label="Previous frame"
      tabindex="-1"
      [disabled]="!hasVideo()"
      (mousedown)="$event.preventDefault()"
      (click)="onStepFrameClick($event, -1)"
    >
      <span class="material-icons">chevron_left</span>
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-sm tooltip tooltip-top"
      [attr.data-tip]="isPlaying() ? 'Pause' : 'Play'"
      [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
      tabindex="-1"
      [disabled]="!hasVideo()"
      (mousedown)="$event.preventDefault()"
      (click)="videoPlayerState.toggleIsPlaying()"
    >
      @if (isPlaying()) {
        <span class="material-icons">pause</span>
      } @else {
        <span class="material-icons">play_arrow</span>
      }
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-sm tooltip tooltip-top step-tip"
      data-tip="Next frame&#10;(Shift+click = 10 frames)"
      aria-label="Next frame"
      tabindex="-1"
      [disabled]="!hasVideo()"
      (mousedown)="$event.preventDefault()"
      (click)="onStepFrameClick($event, 1)"
    >
      <span class="material-icons">chevron_right</span>
    </button>
  </div>

  <app-dropdown #speedDropdown class="dropdown-top">
    <app-dropdown-trigger>
      <button
        appDropdownTrigger
        type="button"
        class="btn btn-ghost btn-sm min-w-16 tooltip tooltip-top"
        data-tip="Playback speed"
        aria-label="Playback speed"
        tabindex="-1"
        [disabled]="!hasVideo()"
        (mousedown)="$event.preventDefault()"
      >
        {{ playbackRateLabel() }}
      </button>
    </app-dropdown-trigger>
    <app-dropdown-content>
      <ul class="menu menu-sm p-1 min-w-24">
        @for (option of playbackRateOptions; track option.rate) {
          <li>
            <a
              [class.active]="option.rate === playbackRate()"
              (click)="
                videoPlayerState.setPlaybackRate(option.rate);
                speedDropdown.close()
              "
            >
              {{ option.label }}
            </a>
          </li>
        }
      </ul>
    </app-dropdown-content>
  </app-dropdown>

  <input
    #rangeInput
    type="range"
    class="range range-xs seek-range"
    min="0"
    max="{{ sliderMax() }}"
    [value]="currentTime()"
    [disabled]="!hasVideo()"
    (input)="onSliderInput(rangeInput.value)"
    (change)="onSliderChange(rangeInput.value)"
    step="{{ step() }}"
    aria-label="Seek"
  />
  <label class="time-display frame-display tooltip tooltip-top" data-tip="Click to enter frame">
    Frame
    <input
      class="jump-field frame-jump"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      aria-label="Frame"
      [disabled]="!hasVideo()"
      [value]="frameFieldValue()"
      (focus)="onFrameFocus($event)"
      (input)="onFrameInput($any($event.target).value)"
      (keydown.enter)="onFrameEnter($event)"
      (keydown.escape)="onFrameEscape($event)"
      (blur)="onFrameBlur($event)"
    />
  </label>
  <label class="time-display time-range tooltip tooltip-top" data-tip="Click to enter time">
    <input
      class="jump-field time-jump"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      aria-label="Time"
      [disabled]="!hasVideo()"
      [value]="timeFieldValue()"
      (focus)="onTimeFocus($event)"
      (input)="onTimeInput($any($event.target).value)"
      (keydown.enter)="onTimeEnter($event)"
      (keydown.escape)="onTimeEscape($event)"
      (blur)="onTimeBlur($event)"
    />
    / {{ durationFormatted() }} s
  </label>

  <div class="tooltip tooltip-top tooltip-end shortcut-help-tooltip">
    <div class="tooltip-content shortcut-help">
      <p>Click <em>frame</em> or <em>time</em> to enter a value.</p>
      <p class="shortcut-heading">Keyboard controls:</p>
      <table>
        <tbody>
          <tr>
            <th>Space</th>
            <td>Play / pause</td>
          </tr>
          <tr>
            <th>← / →</th>
            <td>Previous / next frame</td>
          </tr>
          <tr>
            <th>Shift+← / →</th>
            <td>Jump 10 frames</td>
          </tr>
          <tr>
            <th>Home / End</th>
            <td>First / last frame</td>
          </tr>
          <tr>
            <th>- / =</th>
            <td>Slower / faster</td>
          </tr>
          <tr>
            <th>a</th>
            <td>Add current frame</td>
          </tr>
        </tbody>
      </table>
    </div>
    <button
      type="button"
      class="btn btn-ghost btn-sm btn-circle"
      aria-label="Playback help"
      tabindex="-1"
      (mousedown)="$event.preventDefault()"
    >
      <span class="material-icons">info</span>
    </button>
  </div>
</div>
